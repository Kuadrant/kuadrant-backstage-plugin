apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhcl-rhdh-plugin-role
  labels:
    app.kubernetes.io/part-of: kuadrant-rhdh-release-test
rules:
  - apiGroups: ["kuadrant.io"]
    resources: [authpolicies, ratelimitpolicies, dnspolicies, tlspolicies]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions.kuadrant.io"]
    resources: [planpolicies]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apiproducts, apikeys]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apikeyrequests]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: [apikeyapprovals]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [gateways, httproutes]
    verbs: ["get", "list", "watch"]
  # not in the 1.4 or pre-release docs; the mcp pages need it
  - apiGroups: ["mcp.kuadrant.io"]
    resources: [mcpgatewayextensions, mcpserverregistrations]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: [secrets]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhcl-rhdh-plugin-binding
  labels:
    app.kubernetes.io/part-of: kuadrant-rhdh-release-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhcl-rhdh-plugin-role
subjects:
  - kind: ServiceAccount
    name: default
    namespace: rhdh
