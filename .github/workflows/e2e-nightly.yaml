name: E2E Tests (Nightly)

# the e2e cluster installs kuadrant latest, so main can break without a commit here
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  e2e:
    uses: ./.github/workflows/ci.yml
    with:
      e2e-only: true

  report-failure:
    needs: e2e
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: nightly-e2e-issues
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Ensure labels exist
        run: |
          for label in nightly-failure nightly-infrastructure e2e; do
            gh label create "$label" 2>/dev/null || true
          done

      - name: Determine failure type
        id: failure
        env:
          FAILURE_TYPE: ${{ needs.e2e.outputs.failure-type }}
        run: |
          if [[ "$FAILURE_TYPE" == "test" ]]; then
            echo "type=test" >> "$GITHUB_OUTPUT"
            echo "label=nightly-failure" >> "$GITHUB_OUTPUT"
          else
            echo "type=infrastructure" >> "$GITHUB_OUTPUT"
            echo "label=nightly-infrastructure" >> "$GITHUB_OUTPUT"
          fi

      - name: Download test results
        if: steps.failure.outputs.type == 'test'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: playwright-results-json
          path: ./results
        continue-on-error: true

      - name: List failed tests
        if: steps.failure.outputs.type == 'test'
        continue-on-error: true
        shell: node {0}
        run: |
          const fs = require('fs');
          const files = fs.existsSync('results')
            ? fs.readdirSync('results').filter((f) => /^playwright-results.*\.json$/.test(f))
            : [];
          const reports = files.map((f) => JSON.parse(fs.readFileSync(`results/${f}`, 'utf8')));
          const specs = (suites = []) => suites.flatMap((s) => [...(s.specs || []), ...specs(s.suites)]);
          const entries = reports.flatMap((r) => specs(r.suites));
          const list = (status) =>
            entries
              .filter((spec) => spec.tests?.some((t) => t.status === status))
              .map((spec) => `- \`${spec.file}\`: ${spec.title}`);
          const failed = list('unexpected');
          const flaky = list('flaky');
          // global setup failures have no test to blame, only run-level errors
          const errors = reports
            .flatMap((r) => r.errors || [])
            .map((e) => (e.message || '').replace(/\x1b\[[0-9;]*m/g, '').split('\n')[0])
            .filter(Boolean);
          let out = '\n### Failed tests\n\n';
          out += files.length
            ? failed.join('\n') || 'No failed Playwright tests in results'
            : 'Test results JSON not available';
          if (flaky.length) out += `\n\n### Flaky tests\n\n${flaky.join('\n')}`;
          if (errors.length) out += `\n\n### Errors\n\n${errors.map((e) => `- ${e}`).join('\n')}`;
          fs.writeFileSync('tests.md', `${out}\n`);

      - name: Build report
        env:
          FAILURE_TYPE: ${{ steps.failure.outputs.type }}
        run: |
          jobs=$(gh run view "$GITHUB_RUN_ID" --json jobs) || jobs='{"jobs":[]}'
          failed_steps=$(jq -r '[.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name] | join(", ")' <<<"$jobs")
          job_id=$(jq -r '[.jobs[] | select(.conclusion == "failure")][0].databaseId // empty' <<<"$jobs")

          cat > report.md <<EOF
          - **Date:** $(date -u +%Y-%m-%d)
          - **Run:** ${RUN_URL}
          - **Failure type:** ${FAILURE_TYPE}
          - **Failed steps:** ${failed_steps:-unknown}
          EOF

          if [[ -f tests.md ]]; then
            cat tests.md >> report.md
          elif [[ "$FAILURE_TYPE" == "test" ]]; then
            printf '\n### Failed tests\n\nCould not parse test results\n' >> report.md
          fi

          # the lines leading up to the first error annotation usually name the cause
          # curl, not gh api: gh refuses to print a body that contains escape sequences
          if [[ "$FAILURE_TYPE" == "infrastructure" && -n "$job_id" ]] &&
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o job.log \
              "${GITHUB_API_URL}/repos/${GH_REPO}/actions/jobs/${job_id}/logs"; then
            first_error=$(grep -n -m1 '##\[error\]' job.log | cut -d: -f1) || true
            if [[ -n "$first_error" ]]; then
              start=$((first_error > 15 ? first_error - 15 : 1))
              {
                printf '\n### Log excerpt\n\n```text\n'
                sed -n "${start},${first_error}p" job.log |
                  sed -E -e 's/^[0-9TZ:.-]+ //' -e $'s/\x1b\\[[0-9;]*m//g' | cut -c1-400
                printf '```\n'
              } >> report.md
            fi
          fi

      - name: Create issue or add comment
        env:
          FAILURE_TYPE: ${{ steps.failure.outputs.type }}
          LABEL: ${{ steps.failure.outputs.label }}
          PROJECT_TOKEN: ${{ secrets.ADD_ISSUES_TOKEN }}
        run: |
          open=$(gh issue list --label "$LABEL" --state open --limit 1 --json number,createdAt \
            --jq '.[0] // empty | "\(.number) \(.createdAt)"')
          last_pass=$(gh run list --workflow "$GITHUB_WORKFLOW" --branch main --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          number=${open%% *}
          stale=""

          # an issue opened before the last passing run belongs to an earlier failing streak
          if [[ -n "$open" && -n "$last_pass" ]] && (( $(date -d "${open#* }" +%s) < $(date -d "$last_pass" +%s) )); then
            stale=$number
            number=""
          fi

          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file report.md
          else
            {
              echo "Nightly E2E is failing on main. Later failures are added as comments, and this issue closes when a nightly run passes."
              echo
              cat report.md
            } > issue.md
            url=$(gh issue create --title "Nightly E2E ${FAILURE_TYPE} failures since $(date -u +%Y-%m-%d)" \
              --label "$LABEL" --label e2e --body-file issue.md)
            number=${url##*/}
            if [[ -n "$stale" ]]; then
              gh issue close "$stale" --comment "Superseded by #${number}: nightly E2E passed after this issue was opened."
            fi
          fi

          # issues opened with GITHUB_TOKEN trigger no workflow, so put them on the board here
          GH_TOKEN="$PROJECT_TOKEN" gh project item-add 18 --owner Kuadrant --url "${GITHUB_SERVER_URL}/${GH_REPO}/issues/${number}"

  close-issues:
    needs: e2e
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: nightly-e2e-issues
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close resolved issues
        run: |
          for label in nightly-failure nightly-infrastructure; do
            numbers=$(gh issue list --label "$label" --state open --json number --jq '.[].number')
            for number in $numbers; do
              gh issue close "$number" --comment "Nightly E2E passed: ${RUN_URL}"
            done
          done
